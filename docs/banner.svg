<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#5a9bff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#1a4ea0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0d12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="95%" r="50%">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fb0ff"/>
      <stop offset="100%" stop-color="#3b6fd9"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow1)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>

  <!-- faint starfield -->
  <g fill="#9fc0ff" opacity="0.5">
    <circle cx="120" cy="48" r="1.2"/>
    <circle cx="260" cy="90" r="0.8"/>
    <circle cx="60" cy="140" r="1"/>
    <circle cx="980" cy="60" r="1.1"/>
    <circle cx="1060" cy="150" r="0.9"/>
    <circle cx="1130" cy="40" r="1.3"/>
    <circle cx="200" cy="270" r="0.9"/>
    <circle cx="340" cy="230" r="0.7"/>
    <circle cx="1000" cy="280" r="1"/>
    <circle cx="1100" cy="230" r="0.8"/>
    <circle cx="700" cy="40" r="0.8"/>
    <circle cx="820" cy="90" r="1"/>
  </g>

  <!-- logo mark: rounded square badge with abstract dragon glyph -->
  <g transform="translate(64,98)">
    <rect x="0" y="0" width="144" height="144" rx="28" fill="#11151d" stroke="#2d3a52" stroke-width="1.5"/>
    <rect x="0" y="0" width="144" height="144" rx="28" fill="url(#glow1)" opacity="0.6"/>
    <g transform="translate(72,72)" filter="url(#softBlur)">
      <path d="M0 -46 L14 -18 L46 -22 L26 4 L48 18 L18 22 L22 46 L0 30 L-22 46 L-18 22 L-48 18 L-26 4 L-46 -22 L-14 -18 Z"
            fill="url(#markFill)"/>
      <circle cx="0" cy="0" r="7" fill="#0a0d12"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Inter', Arial, sans-serif" fill="#e6e8eb">
    <text x="240" y="168" font-size="56" font-weight="700" letter-spacing="-1">MilkyWayOS</text>
    <text x="240" y="204" font-size="19" font-weight="500" fill="#8a92a0">A Linux style desktop OS, rebuilt as a portfolio</text>
  </g>

  <!-- terminal style tagline -->
  <g font-family="'Cascadia Code','JetBrains Mono',ui-monospace,monospace" font-size="18">
    <text x="240" y="248" fill="#5fff87">┌──(</text>
    <text x="288" y="248" fill="#5fff87">s0L㉿milkyway</text>
    <text x="452" y="248" fill="#5fff87">)-[~]</text>
    <text x="240" y="272" fill="#5fff87">└─$</text>
    <text x="284" y="272" fill="#e6e8eb">whoami</text>
    <text x="370" y="272" fill="#5b6271">  Joseph Benjamin Sollestre, Cybersecurity Specialist</text>
  </g>

  <rect x="240" y="296" width="920" height="1" fill="#232932"/>
  <g font-family="'Cascadia Code','JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#5b6271">
    <text x="240" y="320">React 18 · No build step · CTF platform builder · Purple team &amp; AI/ML security</text>
  </g>
</svg>
